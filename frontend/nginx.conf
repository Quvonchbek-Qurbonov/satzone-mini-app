server {
    listen 80;
    server_name _;

    # Static SPA assets — long cache for hashed files.
    root /usr/share/nginx/html;
    index index.html;

    # Strict CSP — only allow Telegram + KaTeX CDN we pin in index.html.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' https://telegram.org 'unsafe-inline'; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; font-src 'self' https://cdn.jsdelivr.net data:; connect-src 'self' https:; frame-ancestors https://web.telegram.org https://*.telegram.org https://*.t.me" always;
    add_header X-Frame-Options "ALLOW-FROM https://web.telegram.org" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API and media are proxied to the backend by your edge / docker-compose.
    location ~ ^/(api|media)/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
